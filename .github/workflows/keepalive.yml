# Keep-alive for the HQ schedule.
#
# GitHub disables scheduled workflows in a repository after 60 days with no
# repository activity. This workflow runs once a month and commits a timestamp to
# keepalive.txt, which counts as activity. Nothing else depends on the file.
name: keepalive

on:
  schedule:
    - cron: "17 4 1 * *"   # 1st day of each month, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write timestamp and commit it if it changed
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > keepalive.txt
          git config user.name "hq-keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add keepalive.txt
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "chore: monthly keepalive"
            git push
          fi
